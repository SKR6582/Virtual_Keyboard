<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Virtual Keyboard HUD Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body>
  <div class="overlay-container">
    <div class="drag-header">
      <span>CV-Type HUD</span>
      <div class="overlay-status">
        <span class="overlay-dot" id="overlay-dot"></span>
        <span id="overlay-status-text">Ready</span>
      </div>
    </div>
    <div class="keyboard-hud-grid" id="hud-grid">
      <!-- Dynamically generated keys -->
    </div>
  </div>

  <script src="js/overlay.js"></script>
</body>
</html>
